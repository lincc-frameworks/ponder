# DP1 LSSTComCam configuration. Non-FOV science settings match the preserved
# /sdf/scratch/rubin/kbmod/ponder/dp1_only/sorcha_ponder_config.ini baseline.

[INPUT]
ephemerides_type = ar
eph_format = csv
size_serial_chunk = 5000
aux_format = csv
pointing_sql_query = SELECT observationId, observationStartMJD as observationStartMJD_TAI, visitTime, visitExposureTime, band as optFilter, seeingFwhmGeom as seeingFwhmGeom_arcsec, seeingFwhmEff as seeingFwhmEff_arcsec, fiveSigmaDepth as fieldFiveSigmaDepth_mag , fieldRA as fieldRA_deg, fieldDec as fieldDec_deg, rotSkyPos as fieldRotSkyPos_deg FROM observations order by observationId

[SIMULATION]
ar_ang_fov = 0.50
ar_fov_buffer = 0.20
ar_picket = 1
ar_obs_code = X05
ar_healpix_order = 6

[FILTERS]
observing_filters = r,g,i,z,u,y

[SATURATION]
bright_limit = 16.0

[PHASECURVES]
phase_function = none

[FOV]
camera_model = circle
# No fill factor: this cone deliberately encloses all nine ComCam sensors,
# including gaps. The farthest sensor corner is 0.491384 degrees.
circle_radius = 0.50

[FADINGFUNCTION]
fading_function_width = 0.1
fading_function_peak_efficiency = 1.

[LINKINGFILTER]
SSP_detection_efficiency = 0.95
SSP_number_observations = 2
SSP_separation_threshold = 0.5
SSP_maximum_time = 0.0625
SSP_number_tracklets = 3
SSP_track_window = 15
SSP_night_start_utc = 16.0

[OUTPUT]
output_format = csv
output_columns = basic

[LIGHTCURVE]
lc_model = none

[ACTIVITY]
comet_activity = none
