# DECam W84 geometry validation. No detection/completeness or photometric claim.
# Use --physical-parameters with measured H_VR keyed by ObjID.
[PONDER]
backend = deep_geometry

[INPUT]
ephemerides_type = ar
eph_format = csv
size_serial_chunk = 200
aux_format = csv
pointing_sql_query = SELECT observationId, observationStartMJD as observationStartMJD_TAI, visitTime, visitExposureTime, band as optFilter, seeingFwhmGeom as seeingFwhmGeom_arcsec, seeingFwhmEff as seeingFwhmEff_arcsec, fiveSigmaDepth as fieldFiveSigmaDepth_mag, fieldRA as fieldRA_deg, fieldDec as fieldDec_deg, rotSkyPos as fieldRotSkyPos_deg FROM observations ORDER BY observationStartMJD

[SIMULATION]
ar_ang_fov = 1.1
ar_fov_buffer = 0.2
ar_picket = 1
ar_obs_code = W84
ar_healpix_order = 6

[FILTERS]
observing_filters = VR

[PHASECURVES]
phase_function = none

[FOV]
camera_model = circle
circle_radius = 1.1

[OUTPUT]
output_format = csv
output_columns = ObjID,FieldID,fieldMJD_TAI,RA_deg,Dec_deg,optFilter

[LIGHTCURVE]
lc_model = none

[ACTIVITY]
comet_activity = none

[EXPERT]
randomization_on = False
default_snr_cut = False
trailing_losses_on = False
vignetting_on = False
brute_force = True

# Frozen cached Earth-orientation kernel covering all DEEP 2019-2022 dates.
# Sorcha 1.1.1's default 2025 filename is no longer served at its original URL.
[AUXILIARY]
earth_historical = earth_620120_240827.bpc
earth_historical_url = https://naif.jpl.nasa.gov/pub/naif/generic_kernels/pck/a_old_versions/earth_620120_240827.bpc
earth_predict = earth_200101_990827_predict.bpc
earth_predict_url = https://naif.jpl.nasa.gov/pub/naif/generic_kernels/pck/a_old_versions/earth_200101_990827_predict.bpc
